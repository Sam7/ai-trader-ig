name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  INFRA_DIR: src/Trading.Infrastructure
  WORKER_PROJECT: src/Trading.Worker/Trading.Worker.csproj
  PUBLISH_DIR: artifacts/publish/worker
  PACKAGE_PATH: artifacts/ai-trader-worker.tar.gz

jobs:
  deploy:
    name: Test, publish, provision, deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'us-central1-a' }}
      NAME_PREFIX: ${{ vars.NAME_PREFIX || 'ai-trader' }}
      PULUMI_STACK: ${{ vars.PULUMI_STACK || 'dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate required secrets
        shell: bash
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          APPSETTINGS_PRODUCTION_JSON: ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
        run: |
          required=(
            GCP_CREDENTIALS
            GCP_PROJECT_ID
            PULUMI_ACCESS_TOKEN
            PULUMI_CONFIG_PASSPHRASE
            APPSETTINGS_PRODUCTION_JSON
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret or environment value: $name" >&2
              exit 1
            fi
          done

      - name: Restore
        run: dotnet restore ./Trading.slnx

      - name: Validate host recovery and exit-evidence scripts
        shell: bash
        run: |
          bash tests/host/install-vm-legacy-backup-tests.sh
          bash tests/host/capture-worker-exit-evidence-tests.sh

      - name: Test
        run: dotnet test ./Trading.slnx --configuration Release --no-restore

      - name: Publish worker
        shell: bash
        run: |
          dotnet publish "$WORKER_PROJECT" \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$PUBLISH_DIR" \
            /p:PublishSingleFile=false \
            /p:DebugType=None \
            /p:DebugSymbols=false

      - name: Inject production settings and package worker
        shell: bash
        env:
          APPSETTINGS_PRODUCTION_JSON: ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
        run: |
          mkdir -p "$(dirname "$PACKAGE_PATH")"
          printf '%s' "$APPSETTINGS_PRODUCTION_JSON" > "$PUBLISH_DIR/appsettings.json"
          python3 -m json.tool "$PUBLISH_DIR/appsettings.json" >/dev/null
          cp tracked-markets.json "$PUBLISH_DIR/tracked-markets.json"
          chmod +x "$PUBLISH_DIR/Trading.Worker"
          tar -czf "$PACKAGE_PATH" -C "$PUBLISH_DIR" .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: ">= 416.0.0"

      - name: Set up Pulumi CLI
        uses: pulumi/setup-pulumi@v2

      - name: Provision infrastructure
        id: pulumi
        shell: bash
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          pulumi -C "$INFRA_DIR" stack select "$PULUMI_STACK" \
            || pulumi -C "$INFRA_DIR" stack init "$PULUMI_STACK"

          pulumi -C "$INFRA_DIR" config set gcp:project "$GCP_PROJECT_ID"
          pulumi -C "$INFRA_DIR" config set gcp:region "$GCP_REGION"
          pulumi -C "$INFRA_DIR" config set gcp:zone "$GCP_ZONE"
          pulumi -C "$INFRA_DIR" config set region "$GCP_REGION"
          pulumi -C "$INFRA_DIR" config set zone "$GCP_ZONE"
          pulumi -C "$INFRA_DIR" config set namePrefix "$NAME_PREFIX"

          pulumi -C "$INFRA_DIR" up --yes --refresh

          {
            echo "worker_instance_name=$(pulumi -C "$INFRA_DIR" stack output workerInstanceName)"
            echo "worker_instance_zone=$(pulumi -C "$INFRA_DIR" stack output workerInstanceZone)"
            echo "backup_bucket_name=$(pulumi -C "$INFRA_DIR" stack output backupBucketName)"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for VM SSH readiness
        shell: bash
        env:
          WORKER_INSTANCE_NAME: ${{ steps.pulumi.outputs.worker_instance_name }}
          WORKER_INSTANCE_ZONE: ${{ steps.pulumi.outputs.worker_instance_zone }}
        run: |
          for attempt in {1..12}; do
            if gcloud compute ssh "$WORKER_INSTANCE_NAME" \
              --project "$GCP_PROJECT_ID" \
              --zone "$WORKER_INSTANCE_ZONE" \
              --quiet \
              --ssh-flag="-o ConnectTimeout=10" \
              --command "true"; then
              echo "VM SSH is ready on attempt $attempt."
              exit 0
            fi

            echo "VM SSH is not ready on attempt $attempt/12; retrying in 10 seconds."
            sleep 10
          done

          echo "VM SSH did not become ready. Capturing guest diagnostics before failing." >&2
          gcloud compute instances describe "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --format='yaml(name,status,machineType,networkInterfaces[].accessConfigs[].natIP)' || true
          gcloud compute instances get-serial-port-output "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --port=1 || true
          exit 1

      - name: Stage release on VM
        shell: bash
        env:
          WORKER_INSTANCE_NAME: ${{ steps.pulumi.outputs.worker_instance_name }}
          WORKER_INSTANCE_ZONE: ${{ steps.pulumi.outputs.worker_instance_zone }}
        run: |
          gcloud compute ssh "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --quiet \
            --command "mkdir -p /tmp/ai-trader-deploy"

          gcloud compute scp \
            "$PACKAGE_PATH" \
            "$INFRA_DIR/host/ai-trader.service" \
            "$INFRA_DIR/host/capture-worker-exit-evidence.sh" \
            "$INFRA_DIR/host/install-vm.sh" \
            "$WORKER_INSTANCE_NAME:/tmp/ai-trader-deploy/" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --quiet

      - name: Install and restart service
        shell: bash
        env:
          WORKER_INSTANCE_NAME: ${{ steps.pulumi.outputs.worker_instance_name }}
          WORKER_INSTANCE_ZONE: ${{ steps.pulumi.outputs.worker_instance_zone }}
          BACKUP_BUCKET_NAME: ${{ steps.pulumi.outputs.backup_bucket_name }}
        run: |
          gcloud compute ssh "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --quiet \
            --command "sudo bash /tmp/ai-trader-deploy/install-vm.sh '$BACKUP_BUCKET_NAME'"

      - name: Validate market-data collection
        shell: bash
        env:
          WORKER_INSTANCE_NAME: ${{ steps.pulumi.outputs.worker_instance_name }}
          WORKER_INSTANCE_ZONE: ${{ steps.pulumi.outputs.worker_instance_zone }}
        run: |
          expected_market_count="$(
            python3 -c 'import json, pathlib; config = json.loads(pathlib.Path("tracked-markets.json").read_text()); markets = config["AI"]["DailyBriefing"]["TrackedMarkets"]; print(len({market["InstrumentId"].strip() for market in markets if market.get("InstrumentId")}))'
          )"

          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            if gcloud compute ssh "$WORKER_INSTANCE_NAME" \
              --project "$GCP_PROJECT_ID" \
              --zone "$WORKER_INSTANCE_ZONE" \
              --quiet \
              --command "systemctl is-active --quiet ai-trader.service && main_pid=\$(systemctl show ai-trader.service -p MainPID --value) && active_since=\$(systemctl show ai-trader.service -p ActiveEnterTimestamp --value) && test \"\$main_pid\" -gt 0 && sudo test -f /var/lib/ai-trader/health/worker-status.json && sudo grep -Eq '\"processId\"[[:space:]]*:[[:space:]]*'\"\$main_pid\"'([,[:space:]]|$)' /var/lib/ai-trader/health/worker-status.json && sudo test -f /var/lib/ai-trader/market-data/ig-market-data.sqlite && health_count=\$(sudo sqlite3 /var/lib/ai-trader/market-data/ig-market-data.sqlite 'select count(distinct instrument_fk) from market_data_health;') && test \"\$health_count\" -ge '$expected_market_count' && sudo journalctl -u ai-trader.service --since \"\$active_since\" --no-pager | grep -q 'Started IG Lightstreamer chart session'"; then
              echo "Market-data collection validated for $expected_market_count tracked market(s)."
              exit 0
            fi

            sleep 10
          done

          gcloud compute ssh "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --quiet \
            --command "systemctl status ai-trader.service --no-pager || true; sudo test -f /var/lib/ai-trader/health/worker-status.json && sudo tail -n 80 /var/lib/ai-trader/health/worker-status.json || true; sudo journalctl -u ai-trader.service -n 120 --no-pager; sudo test -f /var/lib/ai-trader/market-data/ig-market-data.sqlite && sudo sqlite3 /var/lib/ai-trader/market-data/ig-market-data.sqlite 'select i.instrument_value, mh.connection_state, mh.last_received_update_utc_ticks, mh.updated_at_utc_ticks from market_data_health mh join instruments i on i.id = mh.instrument_fk order by i.instrument_value;' || true" || true

          gcloud compute instances get-serial-port-output "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --port=1 || true

          echo "Market-data collection did not become healthy for $expected_market_count tracked market(s)." >&2
          exit 1

      - name: Validate remote health and snapshot freshness
        shell: bash
        env:
          BACKUP_BUCKET_NAME: ${{ steps.pulumi.outputs.backup_bucket_name }}
        run: |
          validate_object_freshness() {
            local object_uri="$1"
            local max_age_seconds="$2"
            local updated_at
            local updated_epoch
            local now_epoch
            local age

            updated_at="$(gcloud storage objects describe "$object_uri" --format='value(updateTime)')"
            updated_epoch="$(date -d "$updated_at" +%s)"
            now_epoch="$(date -u +%s)"
            age=$((now_epoch - updated_epoch))
            if (( age < 0 || age > max_age_seconds )); then
              echo "$object_uri is stale: updated $updated_at ($age seconds ago)." >&2
              return 1
            fi
            echo "$object_uri is fresh: updated $updated_at ($age seconds ago)."
          }

          validate_object_freshness \
            "gs://$BACKUP_BUCKET_NAME/market-data/health/worker-status.json" \
            180
          validate_object_freshness \
            "gs://$BACKUP_BUCKET_NAME/market-data/ig-market-data.sqlite" \
            600

      - name: Validate market-data-only worker mode
        shell: bash
        env:
          WORKER_INSTANCE_NAME: ${{ steps.pulumi.outputs.worker_instance_name }}
          WORKER_INSTANCE_ZONE: ${{ steps.pulumi.outputs.worker_instance_zone }}
        run: |
          gcloud compute ssh "$WORKER_INSTANCE_NAME" \
            --project "$GCP_PROJECT_ID" \
            --zone "$WORKER_INSTANCE_ZONE" \
            --quiet \
            --command "active_since=\$(systemctl show ai-trader.service -p ActiveEnterTimestamp --value); journal=\$(sudo journalctl -u ai-trader.service --since \"\$active_since\" --no-pager); printf '%s\\n' \"\$journal\" | grep -q 'Automation scheduling is disabled.'; printf '%s\\n' \"\$journal\" | grep -q 'Intraday opportunity scheduling is disabled.'; ! printf '%s\\n' \"\$journal\" | grep -Eq 'Running scheduled (daily briefing|intraday opportunity)'"
